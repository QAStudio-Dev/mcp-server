# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit Configuration
# https://docs.coderabbit.ai/reference/configuration

language: en-US
tone_instructions: 'Be concise and constructive. Expert in TypeScript, MCP (Model Context Protocol), Zod, and Node.js. Focus on tool schema correctness, API compatibility with QA Studio, and safe error handling.'
early_access: false

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_placeholder: '@coderabbitai summary'
  poem: true
  review_status: true
  review_details: false
  review_progress: true
  commit_status: true
  collapse_walkthrough: false

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    base_branches:
      - main
    ignore_title_keywords:
      - WIP
      - '[WIP]'
      - DO NOT MERGE

  path_instructions:
    - path: 'src/index.ts'
      instructions: |
        MCP server tool review:
        - Register tools with `server.registerTool(name, { description, inputSchema }, handler)`
        - `inputSchema` is an object of Zod schemas with `.describe()`, not a wrapping `z.object()`
        - Keep handler try/catch; on failure return `{ content: [{ type: 'text', text }], isError: true }`
        - Use `type: 'text' as const` for content items
        - Authenticate to QA Studio with the existing `X-API-Key` header from `QA_STUDIO_API_KEY`
        - Studio also accepts `Authorization: Bearer`; do not break current X-API-Key clients
        - Do not log API keys
        - Encode query parameters with `encodeURIComponent`
        - Do not send MCP protocol logs to stdout (stdio transport); use stderr for diagnostics
        - New tools must be documented in README.md and CLAUDE.md

    - path: 'src/__tests__/**/*.ts'
      instructions: |
        Vitest review:
        - Cover Zod schema required/optional/enum cases
        - Cover URL construction, request bodies, and error formatting
        - Include encoding/unicode/empty-value edge cases
        - Keep tests independent of a live QA Studio instance

  path_filters:
    - '!**/*.lock'
    - '!**/package-lock.json'
    - '!dist/**'
    - '!coverage/**'

  tools:
    eslint:
      enabled: false
    biome:
      enabled: false
    github-checks:
      enabled: true
    gitleaks:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
  learnings:
    scope: auto
  code_guidelines:
    enabled: true
    filePatterns:
      - 'CLAUDE.md'
      - 'CONTRIBUTING.md'
      - 'README.md'
  automatic_linking_mode: auto
  linked_repositories:
    - repository: QAStudio-Dev/studio
      instructions: 'QA Studio app and public HTTP API this MCP server calls (`QA_STUDIO_API_URL`, default localhost `/api`).'
    - repository: QAStudio-Dev/playwright-reporter
      instructions: 'Playwright reporter using the same runs/results API surface.'
    - repository: QAStudio-Dev/playwright-reporter-python
      instructions: 'pytest plugin using the same runs/results API surface.'
