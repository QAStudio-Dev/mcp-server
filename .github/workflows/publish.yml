name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: 'patch'
      skip_version_bump:
        description: 'Publish the current package.json version without bumping (use after a failed publish)'
        required: false
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # Required for npm trusted publishing (OIDC)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          # Do not set registry-url. setup-node@v4 then writes an .npmrc
          # with _authToken and exports a dummy NODE_AUTH_TOKEN, which
          # makes npm skip OIDC trusted publishing.
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm ci

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ inputs.skip_version_bump }}" == "true" ]]; then
            PACKAGE_VERSION="$(node -p "require('./package.json').version")"
            NEW_VERSION="v${PACKAGE_VERSION}"
            echo "Using existing version $NEW_VERSION"
          else
            NEW_VERSION=$(npm version ${{ inputs.version_bump }} --no-git-tag-version)
            PACKAGE_VERSION="${NEW_VERSION#v}"
            echo "Bumped version to $NEW_VERSION"
          fi
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "package_version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Run format check
        run: npm run format:check

      - name: Commit version bump
        if: ${{ !inputs.skip_version_bump }}
        run: |
          git add package.json package-lock.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.new_version }}"
          git push

      - name: Create Git tag
        if: ${{ !inputs.skip_version_bump }}
        run: |
          git tag ${{ steps.version.outputs.new_version }}
          git push origin ${{ steps.version.outputs.new_version }}

      - name: Publish to npm
        run: |
          unset NODE_AUTH_TOKEN NPM_CONFIG_USERCONFIG
          npm publish --access public

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ steps.version.outputs.new_version }} \
            --title "Release ${{ steps.version.outputs.new_version }}" \
            --notes "## Changes in ${{ steps.version.outputs.new_version }}

          Published to npm: https://www.npmjs.com/package/@qastudio-dev/mcp-server/v/${{ steps.version.outputs.package_version }}

          ### Installation
          \`\`\`bash
          npx @qastudio-dev/mcp-server
          \`\`\`" \
            --latest
